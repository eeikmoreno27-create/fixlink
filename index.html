
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DrumMaster Pro | by Erik Zavala Brandon Duran</title>
    <meta name="theme-color" content="#070b14">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #2dd4bf;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #070b14;
            color: #f8fafc;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
            min-height: 100vh;
        }
        .glass {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .text-glow {
            text-shadow: 0 0 20px rgba(45, 212, 191, 0.5);
        }
        /* Loader Styles */
        #loader-container {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #070b14;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }
        .pulse-loader {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #2dd4bf, #10b981);
            border-radius: 50%;
            animation: pulse 1.5s infinite;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 30px rgba(45, 212, 191, 0.3);
        }
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(45, 212, 191, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 20px rgba(45, 212, 191, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(45, 212, 191, 0); }
        }
    </style>
    <script>
        // SHIM CRÍTICO: Evita que la app falle si process.env no está definido
        window.process = window.process || { env: { API_KEY: "" } };
    </script>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react-dom": "https://esm.sh/react-dom@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body>
    <div id="root">
        <div id="loader-container">
            <div class="pulse-loader">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#070b14" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20"/><path d="m4.93 4.93 14.14 14.14"/><path d="M2 12h20"/><path d="m19.07 4.93-14.14 14.14"/></svg>
            </div>
            <p style="margin-top: 24px; font-weight: 900; letter-spacing: 0.3em; font-size: 10px; color: #2dd4bf; text-transform: uppercase;">DrumMaster Pro</p>
            <p style="margin-top: 8px; font-weight: 400; font-size: 9px; color: #475569; text-transform: uppercase; letter-spacing: 0.1em;">by Erik Zavala</p>
        </div>
    </div>
    <script type="module" src="./index.tsx"></script>
    <script>
        window.addEventListener('load', () => {
            const loader = document.getElementById('loader-container');
            if (loader) {
                setTimeout(() => {
                    loader.style.opacity = '0';
                    setTimeout(() => loader.remove(), 500);
                }, 500);
            }
        });
    </script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
